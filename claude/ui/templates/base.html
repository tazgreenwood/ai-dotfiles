{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
  <div class="max-w-4xl mx-auto p-8">
    {{if .Breadcrumbs}}
    <nav class="mb-6 text-sm text-gray-500">
      {{range $i, $b := .Breadcrumbs}}
        {{if $i}}<span class="mx-1">/</span>{{end}}
        {{if $b.URL}}<a href="{{$b.URL}}" class="hover:underline text-blue-600">{{$b.Label}}</a>{{else}}<span>{{$b.Label}}</span>{{end}}
      {{end}}
    </nav>
    {{end}}
    <div id="content">{{template "content" .}}</div>
  </div>
  <script>
    (function () {
      var contentEl = document.getElementById('content');
      var projectEl = contentEl.querySelector('[data-project]');
      if (!projectEl) return;
      var project = projectEl.getAttribute('data-project');

      function isFocusInsideContent() {
        var active = document.activeElement;
        return !!active && active !== document.body && contentEl.contains(active);
      }

      function swap() {
        if (isFocusInsideContent()) {
          setTimeout(swap, 500);
          return;
        }
        var scrollY = window.scrollY;
        var openStepIds = [];
        contentEl.querySelectorAll('details[data-step-id]').forEach(function (d) {
          if (d.open) openStepIds.push(d.getAttribute('data-step-id'));
        });
        fetch(location.href)
          .then(function (res) { return res.text(); })
          .then(function (html) {
            var newDoc = new DOMParser().parseFromString(html, 'text/html');
            var newContent = newDoc.getElementById('content');
            if (!newContent) return;
            contentEl.innerHTML = newContent.innerHTML;
            openStepIds.forEach(function (id) {
              var el = contentEl.querySelector('details[data-step-id="' + id + '"]');
              if (el) el.open = true;
            });
            window.scrollTo(0, scrollY);
          })
          .catch(function () {});
      }

      var source = new EventSource('/projects/' + encodeURIComponent(project) + '/events');
      source.addEventListener('message', function () {
        swap();
      });
    })();
  </script>
</body>
</html>
{{end}}
